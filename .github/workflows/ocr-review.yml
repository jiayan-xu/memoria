name: ocr-review

# OpenCodeReview 代码审查门禁
# - PR：审查 base..head 的 diff
# - 推送到默认分支：审查 HEAD~1..HEAD
# 需要仓库 Secret：OPCODE_API_KEY（opencode Zen 网关，在 Settings > Secrets 添加）
# LLM provider：自定义 opencode-zen，指向 opencode.ai Zen API
#   url = https://opencode.ai/zen/go/v1（OpenAI Chat Completions 兼容）
#   protocol = openai
# 模型：deepseek-v4-flash（轻量快，实测可扛 ~174k token 大 diff 不超时）
#   —— 优于火山方舟 ark-code-latest（大 diff 稳定 context deadline exceeded）
# 默认门禁：发现评论即 fail CI（见 scripts/ocr-review.sh 的 --gate）
#
# 2026-08-14 门禁阈值调整（R42 后，42 轮审查循环复盘）：
# - **拦截条件**：仅 bug·critical / bug·high（数据安全、编译失败、核心路径破坏）
# - **仅报告**：bug·medium 及以下 + performance/maintainability/documentation/
#   style/other 全级别——近 10 轮已无 bug·critical/high，剩余评论集中在注释
#   措辞/docstring 一致性/风格，继续追逐每轮消耗 ~6M token + 25 分钟 CI
#   且产出递减（R34-R41 评论数 13-19 波动不收敛，R40 出现 critical 误报）。
# 停止标准（满足其一即可人工 approve 合并，不再逐条追改）：
#   a. OCR 连续 2 轮零 bug·critical/bug·high 且 build 三平台全绿；或
#   b. 剩余评论全部为 documentation/style/other·low（纯文字性）。
# 出现 bug·critical/high 时回到逐条修复流程。

on:
  pull_request:
  push:
    branches: [main, master]

# statuses: write 用于把 check-run 结果显式同步成 legacy commit status
# （否则分支保护 required_status_checks 匹配不到 context，合并永远 BLOCKED）
permissions:
  contents: read
  statuses: write

jobs:
  # job 名即 check context 名，必须与分支保护 required_status_checks 的
  # context "ocr" 完全一致，否则门禁永不生效（BLOCKED 但检查全绿）
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: Configure LLM (opencode Zen)
        env:
          OPCODE_API_KEY: ${{ secrets.OPCODE_API_KEY }}
        run: |
          if [ -z "$OPCODE_API_KEY" ]; then
            echo "::error::缺少 Secret OPCODE_API_KEY，请在仓库 Settings > Secrets 配置"
            exit 1
          fi
          # 自定义 provider：opencode Zen API（OpenAI Chat Completions 兼容）
          ocr config set provider opencode-zen
          ocr config set custom_providers.opencode-zen.url https://opencode.ai/zen/go/v1
          ocr config set custom_providers.opencode-zen.protocol openai
          # 模型 ID：deepseek-v4-flash（轻量快，实测可扛 ~174k token 大 diff 不超时）
          ocr config set custom_providers.opencode-zen.model "deepseek-v4-flash"
          ocr config set custom_providers.opencode-zen.api_key "$OPCODE_API_KEY"

      - name: Run review (gate)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="HEAD~1"
            HEAD="HEAD"
          fi
          echo "审查范围: $BASE..$HEAD"
          # 以非 -e 上下文捕获 review 的真实退出码：LLM/API 抖动或 CLI 报错时
          # 不应让 step 直接挂掉（历史上 set -e + pipefail 下 grep 无匹配/非零退出
          # 会把"0 发现也通过"的门禁误判为失败，CI 恒红），降级为仅报告。
          set +e
          OUT=$(ocr review --from "$BASE" --to "$HEAD" \
            --exclude '.github/**,.githooks/**,scripts/ocr-review.sh,**/__pycache__/**,**/*.bak,**/*.exe,**/*.csv,**/target/**' 2>&1)
          REVIEW_RC=$?
          set -e
          echo "$OUT"
          if [ "$REVIEW_RC" -ne 0 ]; then
            echo "::warning::ocr review 运行失败 (rc=$REVIEW_RC)，按零发现仅报告继续；请人工核对上方审查日志"
          fi
          # pipefail 下任一 grep 无匹配都会让整条 pipeline 非零 → set -e 终止；
          # 追加 || true 防御（输出格式变化/零发现时 FINDINGS 回落 0）
          FINDINGS=$(echo "$OUT" | grep -oE '[0-9]+ finding\(s\)' | grep -oE '[0-9]+' | head -1 || true)
          FINDINGS="${FINDINGS:-0}"
          echo "评论数 = $FINDINGS"
          # 2026-08-14：按严重度分级统计（输出格式 [category · severity]）——
          # 门禁只看 bug·critical / bug·high（数据安全/编译/核心路径），其余仅报告。
          CRIT=$(echo "$OUT" | grep -cE '\[bug · critical\]' || true)
          HIGH=$(echo "$OUT" | grep -cE '\[bug · high\]' || true)
          MED=$(echo "$OUT" | grep -cE '\[bug · medium\]' || true)
          BLOCKERS=$((CRIT + HIGH))
          echo "分级: bug·critical=$CRIT, bug·high=$HIGH, bug·medium=$MED, 其他（low/perf/maint/doc/style）=$((FINDINGS - BLOCKERS - MED))"
          # 2026-08-06 决策：门禁仅对 PR 生效；直推 main 仅审查报告不拦截
          # （此前直推 main 任何 AI 评论即 exit 1，导致 CI 恒红、门禁形同虚设）
          # 2026-08-14 升级：拦截阈值收敛为 bug·critical/high（停止标准见顶部注释）
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$BLOCKERS" -gt 0 ]; then
            echo "::error::OpenCodeReview 发现 $BLOCKERS 条 critical/high 级 bug（critical=$CRIT, high=$HIGH），门禁拦截合并"
            exit 1
          fi
          if [ "$BLOCKERS" -eq 0 ]; then
            echo "[ocr] 无 critical/high 级发现（评论 $FINDINGS 条均为 medium 及以下，仅报告不拦截）"
            echo "[ocr] 停止标准提示：连续 2 轮无 critical/high 且 build 全绿 → 可人工 approve 合并"
          fi
          echo "[ocr] 审查完成（评论 $FINDINGS 条，push 模式仅报告）"

      # 把 check-run 结果显式同步成 legacy commit status。
      # 分支保护 required_status_checks 匹配的是 legacy status context（/statuses/{sha}），
      # 而 Actions check-run 从不自动生成它 → 不写这步则合并永远 BLOCKED（检查全绿也 BLOCKED）。
      # context 名必须与分支保护完全一致("ocr")。
      - name: Sync check result to commit status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"; DESC="ocr passed"
          else
            STATE="failure"; DESC="ocr failed"
          fi
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"ocr\",\"description\":\"$DESC\"}"