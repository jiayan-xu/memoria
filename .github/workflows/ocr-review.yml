name: ocr-review

# OpenCodeReview 代码审查门禁
# - PR：审查 base..head 的 diff
# - 推送到默认分支：审查 HEAD~1..HEAD
# 需要仓库 Secret：ARK_API_KEY（火山方舟 AgentPlan，在 Settings > Secrets 添加）
# LLM provider：自定义 volcengine-ark-plan，指向火山 AgentPlan 端点
#   url = https://ark.cn-beijing.volces.com/api/plan/v3（OpenAI Responses API 兼容）
#   protocol = openai-responses
# 默认门禁：发现评论即 fail CI（见 scripts/ocr-review.sh 的 --gate）

on:
  pull_request:
  push:
    branches: [main, master]

# statuses: write 用于把 check-run 结果显式同步成 legacy commit status
# （否则分支保护 required_status_checks 匹配不到 context，合并永远 BLOCKED）
permissions:
  contents: read
  statuses: write

jobs:
  # job 名即 check context 名，必须与分支保护 required_status_checks 的
  # context "ocr" 完全一致，否则门禁永不生效（BLOCKED 但检查全绿）
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: Configure LLM (Volcengine Ark AgentPlan)
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: |
          if [ -z "$ARK_API_KEY" ]; then
            echo "::error::缺少 Secret ARK_API_KEY，请在仓库 Settings > Secrets 配置"
            exit 1
          fi
          # 自定义 provider：火山 AgentPlan 端点（OpenAI Responses API 兼容）
          ocr config set provider volcengine-ark-plan
          ocr config set custom_providers.volcengine-ark-plan.url https://ark.cn-beijing.volces.com/api/plan/v3
          ocr config set custom_providers.volcengine-ark-plan.protocol openai-responses
          # 模型 ID：ark-code-latest
          ocr config set custom_providers.volcengine-ark-plan.model "ark-code-latest"
          ocr config set custom_providers.volcengine-ark-plan.api_key "$ARK_API_KEY"

      - name: Run review (gate)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="HEAD~1"
            HEAD="HEAD"
          fi
          echo "审查范围: $BASE..$HEAD"
          OUT=$(ocr review --from "$BASE" --to "$HEAD" \
            --exclude '.github/**,.githooks/**,scripts/ocr-review.sh,**/__pycache__/**,**/*.bak,**/*.exe,**/*.csv,**/target/**' 2>&1)
          echo "$OUT"
          FINDINGS=$(echo "$OUT" | grep -oE '[0-9]+ finding\(s\)' | grep -oE '[0-9]+' | head -1)
          FINDINGS="${FINDINGS:-0}"
          echo "评论数 = $FINDINGS"
          # 2026-08-06 决策：门禁仅对 PR 生效；直推 main 仅审查报告不拦截
          # （此前直推 main 任何 AI 评论即 exit 1，导致 CI 恒红、门禁形同虚设）
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$FINDINGS" -gt 0 ]; then
            echo "::error::OpenCodeReview 发现 $FINDINGS 条评论，门禁拦截合并"
            exit 1
          fi
          echo "[ocr] 审查完成（评论 $FINDINGS 条，push 模式仅报告）"

      # 把 check-run 结果显式同步成 legacy commit status。
      # 分支保护 required_status_checks 匹配的是 legacy status context（/statuses/{sha}），
      # 而 Actions check-run 从不自动生成它 → 不写这步则合并永远 BLOCKED（检查全绿也 BLOCKED）。
      # context 名必须与分支保护完全一致("ocr")。
      - name: Sync check result to commit status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATE="success"; DESC="ocr passed"
          else
            STATE="failure"; DESC="ocr failed"
          fi
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"ocr\",\"description\":\"$DESC\"}"