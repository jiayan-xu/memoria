name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Check
        run: cargo check --verbose

      - name: Build
        run: cargo build --release --verbose

      # #1（第6轮 test/medium）：此前 CI 不装 open-ontologies 也不设 REQUIRE_ONTOLOGIES_BIN，
      # 三个二进制相关的集成测试每次都静默 return（假绿），materialize→写回闭环从未真正在 CI 跑过，
      # src/ontology.rs 回归可无感漏过。现构建 open-ontologies 并硬要求，让 CI 真实执行闭环。
      # #12（第12轮 bug）：Windows 上二进制名是 `open-ontologies.exe`（带 .exe 后缀），且
      # PowerShell 把 `/tmp` 解释为盘符根目录（D:\tmp）。此前统一用 `cp /tmp/.../open-ontologies`
      # 在 Windows 上失败（找不到 `open-ontologies` 无后缀文件），导致 windows-latest build 门禁红。
      # 用 `shell: bash` 强制 POSIX 语义 + 平台判断后缀，三平台一致。
      - name: Build open-ontologies (for ontology integration tests)
        shell: bash
        run: |
          git clone --depth 1 --branch v1.1.1 https://github.com/fabio-rovai/open-ontologies.git "$RUNNER_TEMP"/open-ontologies
          # --target-dir 固定产物位置：cargo build --manifest-path 的 target 默认落当前工作目录，
          # 冷编译/缓存差异下产物可能不再源码目录，导致下述 cp 静默失败、测试阶段找不到二进制。
          cargo build --release --manifest-path "$RUNNER_TEMP"/open-ontologies/Cargo.toml \
            --target-dir "$RUNNER_TEMP"/oo-target
          # 放到 PATH 上，find_bin 的 which/where 分支能找到
          mkdir -p "$HOME"/.local/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$RUNNER_TEMP"/oo-target/release/open-ontologies.exe "$HOME"/.local/bin/
          else
            cp "$RUNNER_TEMP"/oo-target/release/open-ontologies "$HOME"/.local/bin/
          fi
          # 显式校验产物存在：cp 失败时 set -e 会中断，而非静默带入测试阶段假失败
          ls -la "$HOME"/.local/bin/
          # GITHUB_PATH 追加必须用原生路径：Git Bash 的 $HOME 是 MSYS 形式（/c/Users/...），
          # 直接追加会让 Windows PATH 里是 MSYS 路径，Rust 的 split_paths/is_file 无法解析。
          # 用 cygpath -w 转成 C:\... 形式（非 Windows 平台 cygpath 可能不存在，保持原样）。
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$(cygpath -w "$HOME"/.local/bin)" >> "$GITHUB_PATH"
          else
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Run tests (ontology tests hard-required)
        shell: bash
        run: |
          export REQUIRE_ONTOLOGIES_BIN=1
          cargo test --verbose
